name: Purrcept Android
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.50.0'
          cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tooling/export_cel.py --check
      - run: python -m unittest discover -s tooling -p test_phone_eval.py -v
      - run: flutter pub get
        working-directory: app
      - run: flutter analyze --no-fatal-infos
        working-directory: app
      - run: flutter test test/purrcept
        working-directory: app
      - run: flutter build apk --debug --target-platform android-arm64
        working-directory: app
      - run: ./gradlew :app:testDebugUnitTest --console=plain
        working-directory: app/android
